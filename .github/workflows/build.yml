# Checks and builds SoundCheck for Windows and macOS, with the plugin bundled, on every pull
# request and every push to main, and publishes a release when the version changes.
#
# - Pull request, push to main, or a manual run (Actions → Build → Run workflow): runs the
#   checks and tests, builds both platforms, and keeps the installers as workflow artifacts.
# - Push to main that changes the version in src-tauri/tauri.conf.json to one without a
#   v<version> tag yet: the builds go into a draft release v<version> instead, which is
#   published once the checks pass and both platforms are in it. Other pushes only check.
name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # A newer push to a pull request replaces its checks; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test
      - name: Every UI text translated
        run: npm run check:i18n

  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Decide whether this push releases a new version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The version before this push; empty for a manual run, a pull request or a new branch.
          previous=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            previous=$(git show "$BEFORE:src-tauri/tauri.conf.json" | jq -r .version)
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            release=false; why="$GITHUB_EVENT_NAME: building v$version without a release."
          elif [ -z "$previous" ]; then
            release=false; why="No earlier commit to compare with: building v$version without a release."
          elif [ "$previous" = "$version" ]; then
            release=false; why="The version stayed v$version: building without a release."
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            release=false; why="v$version already has a tag: building without a release."
          else
            release=true; why="The version changed from v$previous to v$version: releasing v$version."
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "$why"
          echo "::notice::$why"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            # The plugin's CMake preset uses the Visual Studio 2022 generator; newer runner
            # images have only later versions.
            os: windows-2022
            args: ""
          - name: macOS
            # Xcode 16 (macOS 15 SDK) is what OBS's plugin build requires.
            os: macos-15
            # Bundles the plugin built below; local macOS builds go without it (it needs Xcode 16).
            args: --target universal-apple-darwin --config src-tauri/tauri.macos-plugin.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # OBS's sources and prebuilt dependencies, downloaded by the plugin's CMake setup.
      - uses: actions/cache@v4
        with:
          path: obs-plugin/.deps
          key: obs-deps-${{ runner.os }}-${{ hashFiles('obs-plugin/buildspec.json') }}

      - name: Build the plugin (Windows, OBS and Streamlabs)
        if: runner.os == 'Windows'
        working-directory: obs-plugin
        run: |
          cmake --preset windows-x64
          cmake --build build_x64 --config RelWithDebInfo
          cmake --preset windows-x64 -B build_x64_streamlabs -DSOUNDCHECK_STREAMLABS=ON
          cmake --build build_x64_streamlabs --config RelWithDebInfo
          Get-Item build_x64/RelWithDebInfo/soundcheck.dll, build_x64_streamlabs/RelWithDebInfo/soundcheck-streamlabs.dll

      - name: Build the plugin (macOS, OBS)
        if: runner.os == 'macOS'
        working-directory: obs-plugin
        run: |
          cmake --preset macos
          cmake --build build_macos --config RelWithDebInfo
          # tauri.macos-plugin.conf.json bundles the plugin from this path.
          expected=build_macos/RelWithDebInfo/soundcheck.plugin
          if [ ! -d "$expected" ]; then
            echo "::error::$expected not found; plugin bundles in the build folder:"
            find build_macos -name '*.plugin' -maxdepth 4
            exit 1
          fi
          lipo -info "$expected/Contents/MacOS/soundcheck"

      - run: npm ci

      # The Rust crate embeds the built frontend, so build that first.
      - name: Rust tests
        run: |
          npm run build
          cargo test --lib --manifest-path src-tauri/Cargo.toml

      # The in-app updater installs only files signed with this key (its public half is
      # plugins.updater.pubkey in tauri.conf.json). Pull requests from forks get no secrets,
      # so they build without the update files; a release can't go without them.
      - id: signing
        name: Decide whether to sign the update files
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if [ "$RELEASE" = "true" ] && [ -z "$KEY" ]; then
            echo "::error::A release needs the TAURI_SIGNING_PRIVATE_KEY secret, so installed copies can update to it."
            exit 1
          elif [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY: building without the update files."
          fi

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }}
          # latest.json, which installed copies check: an NSIS or MSI install gets its own kind
          # (windows-x86_64-nsis / -msi), and anything else asking for windows-x86_64 gets NSIS.
          updaterJsonPreferNsis: true
          # Only for a release: the draft is published by the publish job below.
          tagName: ${{ needs.version.outputs.release == 'true' && format('v{0}', needs.version.outputs.version) || '' }}
          releaseName: ${{ needs.version.outputs.release == 'true' && format('SoundCheck v{0}', needs.version.outputs.version) || '' }}
          releaseBody: |
            Windows: run the `-setup.exe` (or `.msi`) installer. Or, without installing, unzip `x64-portable.zip` and run `SoundCheck.exe`; keep the `obs-plugin` folder next to it. The app isn't code-signed yet, so Windows SmartScreen may warn about an unknown publisher: choose "More info" → "Run anyway".
            macOS: open the `.dmg` and drag SoundCheck to Applications. The app isn't notarized, so the first time, right-click it and choose "Open".

            Updating: versions after 0.3.0 offer each new version themselves (the portable version opens this page instead). From 0.3.0 or earlier, install this one by hand once.

            License: the app is MIT; the bundled plugin (soundcheck.dll, soundcheck-streamlabs.dll, soundcheck.plugin) is GPL-2.0-or-later, with its source in [obs-plugin/](https://github.com/${{ github.repository }}/tree/v${{ needs.version.outputs.version }}/obs-plugin). The installers include the license texts.
          releaseDraft: true
          prerelease: false

      # The app runs from any folder as long as obs-plugin\ sits next to it, which is where it
      # looks for the plugin to install.
      - name: Pack the portable version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "SoundCheck_${{ needs.version.outputs.version }}_x64-portable.zip"
          $dir = "portable/SoundCheck"
          New-Item -ItemType Directory -Force "$dir/obs-plugin" | Out-Null
          Copy-Item src-tauri/target/release/SoundCheck.exe $dir
          Copy-Item obs-plugin/build_x64/RelWithDebInfo/soundcheck.dll, obs-plugin/build_x64_streamlabs/RelWithDebInfo/soundcheck-streamlabs.dll "$dir/obs-plugin"
          # The same license texts the installers carry: the app's (MIT), the plugin's (GPL), the icons' (ISC).
          New-Item -ItemType Directory -Force "$dir/third_party" | Out-Null
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Copy-Item obs-plugin/LICENSE "$dir/obs-plugin/LICENSE.txt"
          Copy-Item third_party/lucide-LICENSE.txt "$dir/third_party"
          # Windows' tar writes zip paths with "/", which every unzip tool reads.
          tar -a -c -f "portable/$name" -C portable SoundCheck
          Get-ChildItem portable -Recurse -File | ForEach-Object { "$($_.FullName)  $($_.Length)" }

      - name: Add the portable version to the release (Windows)
        if: runner.os == 'Windows' && needs.version.outputs.release == 'true'
        # bash, so portable/*.zip is expanded (PowerShell passes it to gh as is).
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.version.outputs.version }}" portable/*.zip --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep the installers (no release)
        if: needs.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SoundCheck-${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            portable/*.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [checks, version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # Both builds add their platform to the draft's latest.json, one after the other; check
      # that neither replaced the other's before installed copies start reading it.
      - name: Check the update manifest has every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${{ needs.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          jq . latest.json
          for platform in windows-x86_64 windows-x86_64-nsis windows-x86_64-msi darwin-aarch64 darwin-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].url and .platforms[$p].signature' latest.json >/dev/null \
              || { echo "::error::latest.json has no $platform entry: rerun the build that's missing."; exit 1; }
          done

      - name: Publish the draft now that every platform is in it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
